<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>War of Lands</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="War of Lands">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f3d2c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--cw:clamp(50px,7.4vh,92px);--gold:#f5c75a;--ink:#f5ecd2;--red:#d8473a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0e0c09;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
svg.i{display:block;flex:0 0 auto}

/* ---- Table ---- */
.table{position:fixed;inset:6px;display:flex;flex-direction:column;gap:6px;padding:8px 14px;border-radius:26px;
  background:radial-gradient(ellipse at 50% 40%,#3c8062,#225639 70%,#153627);
  box-shadow:inset 0 0 90px #0009,0 0 0 9px #5a3b22,0 0 0 11px #2a1a0c;overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:#1d1a14e6;color:var(--ink);cursor:pointer;display:grid;place-items:center;box-shadow:0 3px 8px #000a}
.iconbtn:hover{background:#2c2820}

/* Phase track */
.phase{display:flex;flex-direction:column;align-items:center;gap:4px}
.phase .turnline{font-size:14px;font-weight:700}
.track{display:flex;gap:4px;background:#0007;border-radius:999px;padding:4px}
.track span{font-size:13px;padding:5px 12px;border-radius:999px;opacity:.55;white-space:nowrap}
.track span.on{background:var(--gold);color:#2a1c05;opacity:1;font-weight:700}

.field{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
.lane{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;min-height:calc(var(--cw)*.9)}
.empty{color:#ffffff44;font-size:13px}
.hand-top,.hand{display:flex;justify-content:center;align-items:flex-end;min-height:calc(var(--cw)*1.0);padding-top:4px}
.hand{min-height:calc(var(--cw)*1.45);padding-top:16px}
.hint{align-self:center;background:#0008;border-radius:999px;padding:6px 16px;font-size:14px;min-height:30px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.mybar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.actions{display:flex;gap:8px}

/* Land pile */
.pile{position:relative;width:calc(var(--cw)*.62 + 9px);height:calc(var(--cw)*.86 + 9px);flex:0 0 auto;margin-right:8px}
.pile .layer{position:absolute;width:calc(var(--cw)*.62);height:calc(var(--cw)*.86);border-radius:10px;border:2px dashed #e8dcaa;background:#4a3d27;box-shadow:0 2px 6px #0008}
.pile .card{position:absolute;left:0;top:0;z-index:5}

/* Seats */
.tag{display:flex;gap:12px;align-items:center;background:#0007;padding:5px 16px 5px 5px;border-radius:999px;width:max-content;max-width:100%;margin:0 8px 0 auto;transition:box-shadow .2s}
.tag.active{box-shadow:0 0 0 2px var(--gold),0 0 16px #f5c75a55}
.life{width:52px;height:52px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#ff7a6b,#b52d22 70%,#6d150f);box-shadow:0 3px 8px #000a,inset 0 0 0 2px #0004;color:#fff;flex:0 0 auto}
.life small{font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.9;line-height:1}
.life b{font-size:22px;line-height:1.05}
.life.low{animation:lowlife 1s infinite}
@keyframes lowlife{0%,100%{box-shadow:0 0 0 0 #ff4b3e}50%{box-shadow:0 0 0 8px #ff4b3e55}}
.pinfo{display:flex;flex-direction:column;gap:2px}
.pname{font-weight:700;font-size:15px}
.pstats{display:flex;gap:6px;font-size:14px;align-items:center}

/* Action buttons */
.act{min-width:66px;height:58px;padding:6px 8px;border-radius:14px;border:0;background:#1d1a14;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;box-shadow:0 3px 8px #000a;transition:transform .12s,box-shadow .2s,opacity .2s}
@media (hover:hover){.act:hover:not(:disabled){transform:translateY(-2px)}}
.act:disabled{opacity:.32;cursor:default}
.act span{white-space:nowrap}
.act.glow{background:var(--gold);color:#2a1c05;font-weight:700;box-shadow:0 0 0 2px #fff8,0 0 16px var(--gold)}
.act.danger{background:#4a2a22}

/* Cards */
.card{position:relative;width:var(--cw);height:calc(var(--cw)*1.4);border-radius:12px;flex:0 0 auto;
  background:linear-gradient(#fbf3d9,#ecdfb6);border:2px solid #6e5a33;box-shadow:0 4px 10px #0009;
  display:flex;flex-direction:column;padding:5px;transition:transform .2s,box-shadow .2s,opacity .2s}
.card.goblin{background:linear-gradient(#eef7d0,#cfe39a);border-color:#4d7a22}
.card.elf{background:linear-gradient(#e1f6f0,#b8e2d6);border-color:#23685b}
.card.land{border-style:dashed}
.card .art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw)*.42);border-radius:8px;background:#d9cfa8}
.card.goblin .art{background:radial-gradient(#d9f0a0,#6a962a)}
.card.elf .art{background:radial-gradient(#c3f0e2,#2f8a77)}
.card.land .art{background:radial-gradient(#b8a777,#4a3d27)}
.card .tline{font-size:calc(var(--cw)*.105);font-weight:800;text-transform:uppercase;letter-spacing:.05em;text-align:center;color:#2b2216;background:#0000001f;border-radius:4px;margin-top:3px;padding:1px 0;white-space:nowrap}
.card.mini .tline{display:none}
.card.legendary{box-shadow:0 0 0 2px #f5c75a,0 0 10px #f5c75a88}
.card.legendary .tline{background:#f5c75a;color:#2b2216}
.card.legendary .tline{letter-spacing:0;overflow:hidden;text-overflow:ellipsis}
.lane:has(> :nth-child(6)){--cw:calc(clamp(50px,7.4vh,92px)*.85)}
.card.lunge-up{animation:lungeUp .55s ease-out}
.card.lunge-down{animation:lungeDown .55s ease-out}
@keyframes lungeUp{0%{transform:translateY(0)}35%{transform:translateY(-22px) scale(1.08)}100%{transform:translateY(0)}}
@keyframes lungeDown{0%{transform:translateY(0)}35%{transform:translateY(22px) scale(1.08)}100%{transform:translateY(0)}}
.card.ghost{animation:ghostFade .6s ease-in forwards;pointer-events:none}
@keyframes ghostFade{to{opacity:0;transform:scale(.5) translateY(14px)}}
.card .ench{position:absolute;top:calc(var(--cw)*.3);right:-6px;font-size:calc(var(--cw)*.14);background:#fff;border-radius:999px;padding:0 4px;z-index:2;box-shadow:0 1px 4px #0008}
.card .nm{font-size:calc(var(--cw)*.14);font-weight:700;text-align:center;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#2b2216}
.card .pt{display:flex;justify-content:space-between;font-weight:800;font-size:calc(var(--cw)*.15);margin-top:2px;color:#2b2216}
.card .cost{position:absolute;top:-8px;left:-8px;width:calc(var(--cw)*.3);height:calc(var(--cw)*.3);border-radius:50%;background:#1b1409;color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:calc(var(--cw)*.15);border:2px solid var(--gold);z-index:2}
.card .badge{position:absolute;top:-6px;right:-6px;font-size:calc(var(--cw)*.2);background:#fff;border-radius:50%;width:calc(var(--cw)*.3);height:calc(var(--cw)*.3);display:grid;place-items:center;box-shadow:0 1px 4px #0008;z-index:2}
.card .dmg{position:absolute;bottom:calc(var(--cw)*.2);left:50%;transform:translateX(-50%);background:var(--red);color:#fff;border-radius:999px;padding:0 6px;font-weight:800;font-size:calc(var(--cw)*.14);z-index:2}
.card .sick{position:absolute;bottom:-6px;left:-6px;font-size:calc(var(--cw)*.2);background:#fff;border-radius:50%;width:calc(var(--cw)*.3);height:calc(var(--cw)*.3);display:grid;place-items:center;z-index:2}
.card.mini{width:calc(var(--cw)*.62);height:calc(var(--cw)*.86);padding:3px}
.card.mini .nm,.card.mini .pt,.card.mini .badge{display:none}
.card.clickable{cursor:pointer}
@media (hover:hover){.hand .card.clickable:hover{transform:translateY(-16px) scale(1.1);z-index:5}}
@media (hover:hover){.field .card.clickable:hover{transform:translateY(-4px) scale(1.04)}}
.card.tapped{transform:rotate(10deg);opacity:.82}
.card.sel{box-shadow:0 0 0 3px var(--gold),0 0 18px var(--gold)}
.card.blocker{box-shadow:0 0 0 3px #6fb8ff,0 0 18px #6fb8ff}
.card.target{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px #ff6a5a}50%{box-shadow:0 0 0 6px #ff6a5a88,0 0 20px #ff6a5a}}
.card.dim{filter:saturate(.4) brightness(.8);opacity:.6}
.card.back{width:calc(var(--cw)*.58);height:calc(var(--cw)*.82);margin:0 -10px;background:repeating-linear-gradient(45deg,#5a3f22,#5a3f22 9px,#40291a 9px,#40291a 18px);border:2px solid #2d1d0e;box-shadow:0 3px 8px #000a}
.hand .card:not(.back){margin:0 -8px}

.card .art svg,.inspect .ibig svg{width:100%;height:100%;display:block;border-radius:8px}
/* Inspect panel */
.inspect{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:200px;background:#15110bf2;border-radius:16px;padding:12px;font-size:13px;box-shadow:0 10px 30px #000b;z-index:3}
.inspect .ibig{height:140px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:70px;background:#4a3d27}
.inspect .ibig.goblin{background:radial-gradient(#d9f0a0,#6a962a)}
.inspect .ibig.elf{background:radial-gradient(#c3f0e2,#2f8a77)}
.inspect .iname{font-weight:800;font-size:16px;margin-top:8px}
.inspect .itype{opacity:.8;margin-top:2px}
.inspect .ipt{font-weight:700;margin-top:4px}
.inspect .itext{margin-top:8px;line-height:1.4;opacity:.92}
.inspect .ihint{opacity:.6;text-align:center;padding:40px 0}
.inspect.empty{display:none}

/* Log drawer */
.logdrawer{position:absolute;right:20px;top:70px;bottom:20px;width:270px;background:#15110b;border-radius:16px;padding:12px;overflow:auto;display:none;z-index:4;font-size:12px;box-shadow:0 10px 30px #000b}
.logdrawer.open{display:block}
.logdrawer div{padding:4px 0;border-bottom:1px solid #ffffff14}

/* Overlays */
.overlay{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.overlay.hidden{display:none}
.overlay.solid{background:#0e0c09}
.box{background:#2a2319;border-radius:18px;padding:22px;width:min(360px,92vw);text-align:center;box-shadow:0 12px 40px #000c}
.box h2{margin:4px 0 10px}
.big{font-size:52px;line-height:1.1}
.menu-btn{display:block;width:100%;margin:10px 0;padding:14px;font-size:17px;border-radius:12px;border:0;background:#3b3020;color:var(--ink);cursor:pointer}
.menu-btn.gold{background:var(--gold);color:#2a1c05;font-weight:700}
.menu-btn small{display:block;font-size:12px;font-weight:400;opacity:.75;margin-top:2px}
.legend{font-size:13px;opacity:.85;margin-top:14px;line-height:1.9}

.pile{margin-bottom:22px}
.mtns{position:absolute;left:50%;transform:translateX(-50%);bottom:-20px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;width:86px;z-index:6}
.mtn{color:#ffffff55;display:inline-flex}
.mtn.on{color:var(--gold);filter:drop-shadow(0 0 3px #f5c75a88)}
.mtn.tapped{color:#ffffff33;transform:rotate(90deg);margin:0 4px}
.card.tapped{filter:grayscale(.45)}
.card .tapb{position:absolute;bottom:-6px;right:-6px;width:calc(var(--cw)*.3);height:calc(var(--cw)*.3);border-radius:50%;background:#fff;display:grid;place-items:center;z-index:2;color:#2b2216;box-shadow:0 1px 4px #0008}
.count{align-self:center;background:#0008;border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px;margin-left:8px;white-space:nowrap}
.preview{align-self:center;font-size:13px;background:#0008;border-radius:12px;padding:6px 12px;text-align:center;max-width:94%}
.preview:empty{display:none}
.card:not(.mini) .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.card:not(.mini) .abil{height:calc(var(--cw)*.17);overflow:hidden;align-items:center}
.card:not(.mini) .tline{height:calc(var(--cw)*.13);line-height:calc(var(--cw)*.13);overflow:hidden;padding:0 2px;box-sizing:border-box}
.card:not(.mini) .pt{height:calc(var(--cw)*.17);align-items:center;overflow:hidden}
.card:not(.mini) .nm{height:calc(var(--cw)*.15);line-height:calc(var(--cw)*.15)}
.card.spent::after{content:'Land played';position:absolute;left:0;right:0;top:40%;text-align:center;background:#000d;color:#fff;font-size:10px;font-weight:700;padding:3px 0;z-index:4}
.lowtag{color:#ff8a7a;font-size:12px;font-weight:700}
.abil{display:flex;justify-content:center;gap:4px;margin-top:2px;color:#2b2216}
.abil svg{width:calc(var(--cw)*.17);height:calc(var(--cw)*.17)}
.box.detail{width:min(340px,92vw)}
.dbig{width:160px;height:200px;margin:0 auto 10px;border-radius:12px;overflow:hidden;background:#4a3d27}
.dbig svg{width:100%;height:100%;display:block}
.dbig.goblin{background:#6a962a}
.dbig.elf{background:#2f8a77}
.dtype{opacity:.8;margin-top:2px}
.dtext{line-height:1.45;margin:10px 0;opacity:.95}
.abrows{display:flex;flex-direction:column;gap:8px;text-align:left;margin-bottom:6px}
.abrow{display:flex;align-items:center;gap:10px;font-size:14px}
.abrow svg{flex:0 0 auto}
@media (max-width:900px){.inspect{display:none}.logdrawer{width:auto;left:12px;right:12px;top:64px;bottom:auto;max-height:38%}}
@media (max-width:700px){
  .table{inset:4px;border-radius:18px;padding:6px 8px;box-shadow:inset 0 0 60px #0009}
  .topbar{gap:6px}
  .iconbtn{width:38px;height:38px}
  .track span{padding:4px 8px;font-size:12px}
  .phase .turnline{font-size:13px}
  .mybar{flex-direction:column;align-items:stretch;gap:6px}
  .tag{padding:4px 12px 4px 4px;gap:8px;align-self:center}
  .life{width:44px;height:44px}
  .life b{font-size:18px}
  .pname{font-size:14px}
  .actions{width:100%;gap:6px}
  .act{flex:1;min-width:0;height:54px;font-size:11px;border-radius:12px}
  .act.wide{flex:1.6;padding:6px 2px}
  .hand{min-height:calc(var(--cw)*1.3);padding-top:10px}
}
.mulhand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.stackrow{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:12px}
.stackrow span{font-weight:700}
[data-act],[data-card],button{touch-action:manipulation}
.lcard{position:absolute;left:0;top:0}
.lcard .card.tapped{transform:rotate(90deg);opacity:.75}
.more{position:absolute;top:-8px;right:-8px;z-index:9;background:#1b1409;color:var(--gold);border-radius:999px;padding:0 6px;font-weight:800;font-size:12px;line-height:18px}
.dpile{position:relative;width:calc(var(--cw)*.5);height:calc(var(--cw)*.7);flex:0 0 auto;margin-left:6px}
.dback{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:8px;border:2px solid #2d1d0e;background:repeating-linear-gradient(45deg,#5a3f22 0 9px,#40291a 9px 18px);box-shadow:0 2px 6px #0008}
.dback+.dback{left:3px;top:3px}
.dcount{position:absolute;right:-8px;bottom:-8px;z-index:3;background:#1b1409;color:var(--gold);border-radius:999px;padding:0 7px;font-weight:800;font-size:13px;line-height:20px}
.card.zombie{background:linear-gradient(#e6e9dc,#c3cab0);border-color:#4a5e3a}
.card.zombie .art{background:radial-gradient(#d4dcc4,#4a5e3a)}
.card.knight{background:linear-gradient(#fbf6dc,#e6d9a0);border-color:#8a7a2a}
.card.knight .art{background:radial-gradient(#f3ecc8,#8a7a2a)}
.inspect .ibig.knight{background:radial-gradient(#f3ecc8,#8a7a2a)}
.dbig.knight{background:#8a7a2a}
.card.dragon{background:linear-gradient(#f7e0d4,#e7b29a);border-color:#8a2a1a}
.card.dragon .art{background:radial-gradient(#f3c9b0,#8a2a1a)}
.inspect .ibig.dragon{background:radial-gradient(#f3c9b0,#8a2a1a)}
.dbig.dragon{background:#8a2a1a}
.card.merfolk{background:linear-gradient(#e2f8f5,#b5e6df);border-color:#23787f}
.card.merfolk .art{background:radial-gradient(#c8f1ee,#2a7d86)}
.inspect .ibig.merfolk,.dbig.merfolk{background:radial-gradient(#c8f1ee,#2a7d86)}
.life{position:relative}
.fx{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-weight:900;color:#ff8a7a;font-size:16px;text-shadow:0 2px 4px #000;animation:floatUp 1.1s forwards;z-index:9;pointer-events:none;white-space:nowrap}
.card .fx{font-size:calc(var(--cw)*.24)}
@keyframes floatUp{to{transform:translate(-50%,-28px);opacity:0}}
.gpile{position:relative;width:calc(var(--cw)*.5);height:calc(var(--cw)*.7);flex:0 0 auto;margin-left:6px;cursor:pointer}
.dback.g{background:repeating-linear-gradient(135deg,#3b2f4f 0 9px,#271f35 9px 18px);border-color:#140f1d}
.banner{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;background:#1b1409e6;color:var(--gold);padding:12px 24px;border-radius:14px;font-weight:800;font-size:20px;transition:opacity .25s,transform .25s;z-index:50;text-align:center;white-space:nowrap}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner .bt{font-size:20px;font-weight:800}
.banner .bs{font-size:14px;font-weight:600;color:#e9dcb8;margin-top:4px;white-space:normal;max-width:78vw}
.arrows{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:40}
@media (max-width:700px){.track span:nth-child(-n+2){display:none}.track span{font-size:11px;padding:3px 7px}}
.card[data-act]{-webkit-tap-highlight-color:transparent}
.card[data-act]:active{filter:brightness(1.2)}
.act:active{filter:brightness(1.2)}
/* A full table keeps each row on one line (scrolls sideways) so it can't cover the buttons */
.lane{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;justify-content:flex-start;padding:28px 8px 28px;max-width:100%;scrollbar-width:none}
.lane::-webkit-scrollbar{display:none}
.lane{gap:14px} /* room for tapped (tilted) creatures so neighbours never touch */
.lane > :first-child{margin-left:auto}
.lane > :last-child{margin-right:auto}
.actions{position:relative;z-index:10}
/* Card animations */
.card.arrive{animation:arrive .4s cubic-bezier(.2,.9,.3,1.25)}
@keyframes arrive{from{transform:translateY(-22px) scale(.55);opacity:0}to{transform:none;opacity:1}}
.card.hit{animation:hit .35s ease-out}
@keyframes hit{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-3deg)}40%{transform:translateX(6px) rotate(3deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.card.hit::before{content:'';position:absolute;inset:-3px;border-radius:14px;pointer-events:none;background:#ff4b3e;opacity:0;animation:flash .4s ease-out;z-index:1}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}
/* Loading screen: the five basic lands drop in */
.emb{width:1em;height:1em;vertical-align:-.12em;fill:currentColor;display:inline-block}
.settingsrow{display:flex;gap:8px;width:100%;flex-wrap:wrap}
.win-emb .emb{width:52px;height:52px;display:block;margin:0 auto 6px}
.settingsrow .menu-btn{flex:1;margin:0;padding:10px 4px}
.iconrow{display:flex;gap:10px;justify-content:center;width:100%;margin-top:6px}
.setbtn{width:60px;height:60px;border-radius:14px;border:0;background:#3b3020;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.setbtn.off{opacity:.45}
html[data-theme=light] .setbtn{background:#efe3c4;color:#2a1f0e}
/* How-to-play panel: header and footer stay put, the middle scrolls */
.box.guide{width:min(440px,94vw);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;text-align:left;padding:18px 18px 12px}
.guide .gtitle{text-align:center;margin:2px 0 4px}
.gbody{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:0;flex:1 1 auto;padding-right:6px}
.gh{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:16px 0 4px}
.gsteps{list-style:none;margin:0;padding:0}
.gsteps li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.45;margin:8px 0}
.gnum{flex:0 0 24px;height:24px;border-radius:50%;background:var(--gold);color:#2a1c05;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.gtips{list-style:none;margin:0;padding:0}
.gtips li{position:relative;padding-left:16px;font-size:14px;line-height:1.45;margin:7px 0}
.gtips li::before{content:'';position:absolute;left:2px;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.kw{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #ffffff14;font-size:14px;line-height:1.4}
.kw svg{flex:0 0 auto;margin-top:2px;color:var(--gold)}
.kw b{display:block;font-weight:700;margin-bottom:1px}
.gfoot{flex:0 0 auto;margin:12px 0 0}
.gintro{font-size:14px;line-height:1.5;margin:4px 0 0;opacity:.9}
.guide-card{margin-top:4px}
.gtag{font-size:10px;letter-spacing:.04em;background:var(--gold);color:#2a1c05;border-radius:999px;padding:1px 7px;vertical-align:middle;margin-left:4px}
.gnote{font-size:14px;font-weight:700;background:#ffffff14;border-radius:12px;padding:12px;margin:10px 0 4px;text-align:center}
html[data-theme=light] .gnote{background:#0001}
.gsteps b{font-weight:700}
html[data-theme=light] .kw{border-color:#0001}
html[data-theme=light] .gh{color:#8a5f00}
.splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;gap:10px;background:#1f3d2c;transition:opacity .6s}
.splash.out{opacity:0;pointer-events:none}
.splash-card{width:56px;height:78px;border-radius:9px;background:#e9e1c4;border:2px solid #2b2216;display:flex;flex-direction:column;align-items:center;padding:4px;box-sizing:border-box;animation:landDrop .5s calc(var(--i)*.14s) cubic-bezier(.2,.9,.3,1.2) both,gather .45s calc(1.3s + var(--i)*.1s) forwards}
.splash-card svg{width:100%;height:calc(100% - 14px);border-radius:5px;background:#c8b98a}
.splash-card span{font-size:9px;font-weight:800;color:#2b2216;margin-top:2px}
@keyframes gather{from{transform:none;opacity:1}to{transform:translate(var(--gx),0) scale(.5);opacity:0}}
@keyframes landDrop{from{transform:translateY(-120px) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.splash-cards{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:10px}
.splash-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:200px;text-align:center}
.splash-shield{width:200px;height:240px;display:block;overflow:visible}
.menu-shield{width:110px;height:132px;display:block;margin:0 auto 6px;overflow:visible}
.splash .wedge{opacity:0;animation:wedgeIn .35s ease forwards;animation-delay:var(--d)}
.splash .w{opacity:0;transform:translate(var(--fx),var(--fy));animation:flyIn .6s cubic-bezier(.2,.8,.3,1) forwards;animation-delay:var(--d)}
.splash-title{font-family:Georgia,serif;font-size:22px;color:#b08d57;margin-top:12px;opacity:0;animation:wedgeIn .5s ease forwards;animation-delay:2.5s}
@keyframes wedgeIn{to{opacity:1}}
@keyframes flyIn{to{opacity:1;transform:translate(0,0)}}
@media (prefers-reduced-motion: reduce){.splash *{animation:none!important}.splash-cards{display:none}.splash .wedge,.splash .w,.splash-title{opacity:1}.splash .w{transform:none}}

/* Life total reacts to damage and healing */
.life{position:relative}
.life.hitlife{animation:lifeHit .5s ease-out}
.life.healed{animation:lifeHeal .6s ease-out}
.life .fx{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-weight:900;font-size:15px;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap;pointer-events:none;animation:floatUp 1s ease-out forwards}
@keyframes lifeHit{0%{transform:scale(1);box-shadow:0 0 0 0 #ff4b3e}30%{transform:scale(1.12);box-shadow:0 0 0 8px #ff4b3e55}100%{transform:scale(1);box-shadow:0 0 0 0 #ff4b3e00}}
@keyframes lifeHeal{0%{transform:scale(1);box-shadow:0 0 0 0 #7fe08a}30%{transform:scale(1.1);box-shadow:0 0 0 8px #7fe08a66}100%{transform:scale(1);box-shadow:0 0 0 0 #7fe08a00}}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-26px)}}
@media (prefers-reduced-motion: reduce){.life.hitlife,.life.healed,.life .fx{animation:none}}
@media (prefers-reduced-motion: reduce){.card.arrive,.card.hit,.card.hit::before,.card.lunge-up,.card.lunge-down,.card.ghost{animation:none}}

/* Notches and rounded screen corners */
.table{inset:calc(6px + env(safe-area-inset-top,0px)) calc(6px + env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) calc(6px + env(safe-area-inset-left,0px))}
@media (max-width:700px){.table{inset:calc(4px + env(safe-area-inset-top,0px)) calc(4px + env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) calc(4px + env(safe-area-inset-left,0px))}}
/* Phones in landscape: shorter cards and controls so the whole table fits */
@media (orientation:landscape) and (max-height:520px){
  :root{--cw:clamp(40px,12vh,64px)}
  .topbar .iconbtn{width:34px;height:34px}
  .act{height:44px;min-width:54px;font-size:11px}
  .hint{font-size:12px;min-height:24px;padding:3px 12px}
  .hand{min-height:calc(var(--cw)*1.2);padding-top:6px}
.hand{flex-wrap:wrap;row-gap:6px}
  .table{padding:4px 10px}
}
/* Bigger text for readability */

.hint{font-size:15px}

function abilityIcons(c){
  const out = [];
  if(c.haste) out.push('haste');
  if(c.defender) out.push('shield');
  if(c.poison) out.push('skull');
  if(c.recover) out.push('undo');
  if(c.vigilance) out.push('eye');
  if(c.firstStrike) out.push('sword');
  if(c.trample) out.push('wave');
  if(c.flying) out.push('wing');
  if(c.reach) out.push('spear');
  if(c.doubleStrike) out.push('swords');
  if(c.menace) out.push('pack');
  if(c.lifelink) out.push('drop');
  if(c.onEnter){
    out.push('star');
    if(c.onEnter.draw) out.push('card');
    if(c.onEnter.dmgPlayer) out.push('target');
    if(c.onEnter.heal) out.push('heart');
    if(c.onEnter.pump) out.push('flag');
  }
  if(c.ramp) out.push('sun');
  if(c.lord) out.push('flag');
  if(c.ability) out.push('tap');
  if(c.indestructible) out.push('indest');
  if(c.hexproof) out.push('hexproof');
  if(c.flash) out.push('flash');
  if(c.effect){
    if(c.effect.dmgCreature) out.push('bolt');
    if(c.effect.dmgPlayer) out.push('target');
    if(c.effect.draw) out.push('card');
    if(c.effect.heal) out.push('heart');
  }
  return out;
}
function abilHtml(c){
  const icons = abilityIcons(c);
  if(!icons.length) return '';
  return `<div class="abil">${icons.map(n => `<span data-kw="${n}" title="${ABIL_LABEL[n]}">${ico(n, 14)}</span>`).join('')}</div>`;
}
function detailHtml(c){
  const land = c.type === 'land';
  const kind = land ? 'Land' : c.type === 'equipment' ? 'Equipment' : c.type === 'artifact' ? 'Artifact' : c.type === 'spell' ? ((c.effect && c.effect.aura) ? 'Aura' : 'Spell') : 'Creature';
  const cost = land ? '' : ` · Cost ${c.cost}`;
  const pt = c.type === 'creature' ? `<div class="ipt">⚔️ ${c.p} &nbsp; ♥ ${c.t}</div>` : '';
  const rows = abilityIcons(c).map(n => `<div class="abrow">${ico(n, 18)}<span>${ABIL_LABEL[n]}</span></div>`).join('');
  return `<div class="box detail"><div class="dbig ${c.faction}">${c.art}</div>` +
    `<h2>${c.name}</h2><div class="dtype">${kind}${cost}</div>${pt}` +
    `<p class="dtext">${c.text || 'Gives 1 Essence.'}</p>${rows ? `<div class="abrows">${rows}</div>` : ''}` +
    `<button class="menu-btn gold" data-act="closedetail">Close</button></div>`;
}

function ico(name, size = 20, filled = false){
  return `<svg class="i" viewBox="0 0 24 24" width="${size}" height="${size}" fill="${filled ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`;
}

  }
  if(card.effect.aura){
    target.attached = [...(target.attached || []), card];
    target.p += card.effect.aura.p; target.t += card.effect.aura.t;
    target._fx = `+${card.effect.aura.p}/+${card.effect.aura.t}`;
    setTimeout(() => { delete target._fx; if(G) render(); }, 1100);
    log(`${card.name} gave ${target.name} +${card.effect.aura.p}/+${card.effect.aura.t}.`);
    cleanup();
    return;
  }
  p.grave.push(card);
  target.dmg += card.effect.dmgCreature;
  fx(target, '-' + card.effect.dmgCreature);
  log(`${card.name} dealt ${card.effect.dmgCreature} to ${target.name}.`);
  cleanup();
}

function creatureClick(c, owner){
  if(G.over) return;
  if(G.targeting){ resolveTarget(c); return; }

  if(G.phase === 'main'){
    if(owner !== G.active) return;
    if(G.combatDone){ G.msg = 'Combat is over for this turn.'; return; }
    if(G.attackers.includes(c)){ G.attackers = G.attackers.filter(x => x !== c); return; }
    if(!canAttack(c)){ G.msg = c.defender ? `${c.name} can't attack.` : `${c.name} is summoning sick.`; return; }
    G.attackers.push(c);
    return;
  }

  if(G.phase === 'block'){
    const def = 1 - G.active;
    if(owner === def){
      const b = G.blocks.find(x => x.blocker === c);
      if(b){ G.blocks = G.blocks.filter(x => x !== b); return; }
      if(c.tapped){ G.msg = `${c.name} is tapped.`; return; }
      G.selBlocker = G.selBlocker === c ? null : c;
      return;
    }
    if(owner === G.active && G.attackers.includes(c)){
      if(!G.selBlocker){
        if(G.blocks.some(x => x.attacker === c)){ G.blocks = G.blocks.filter(x => x.attacker !== c); return; }
        G.msg = 'Pick your blocker first.'; return;
      }
      if(!canBlockAttacker(G.selBlocker, c)){ G.msg = `Only flying or reach can block ${c.name}.`; return; }
      G.blocks.push({attacker: c, blocker: G.selBlocker}); sfx('block');
      G.selBlocker = null;
      if(c.menace && G.blocks.filter(x => x.attacker === c).length === 1) G.msg = `${c.name} has menace: it needs a second blocker.`;
    }
  }
}

function attackAllCreatures(){
  if(G.over || G.phase !== 'main' || G.targeting || G.combatDone || G.stack.length || G.discardNeed) return;
  const ready = cur().field.filter(c => canAttack(c) && !G.attackers.includes(c));
  if(!ready.length){ G.msg = 'No creatures can attack.'; return; }
  G.attackers.push(...ready);
  declareAttack();
}

function declareAttack(){
  if(G.over || G.phase !== 'main' || G.targeting || G.combatDone || !G.attackers.length) return;
  sfx('whoosh'); buzz(12);
  G.attackers.forEach(c => { if(!c.vigilance) c.tapped = true; });
  const lungers = [...G.attackers], dir = G.active === viewer() ? 'up' : 'down';
  lungers.forEach(c => { c._lunge = dir; });
  setTimeout(() => { lungers.forEach(c => { c._lunge = null; }); if(G) render(); }, 650);
  const def = opp();
  log(`${cur().name} attack with ${G.attackers.length} creature(s).`);
  G.phase = 'block';
  G.selBlocker = null;
  G.blocks = [];

  if(!def.field.some(c => !c.tapped)){ openDamageWindow(); return; }

  const aiDefends = G.vsAI && G.active === G.human;
  if(aiDefends){
    schedule(() => { aiBlock(); openDamageWindow(); }, 900);
    return;
  }
  if(!G.vsAI) G.showPass = `${def.name}: pick your blockers.`;
}

/* Flying can only be blocked by flying or reach */
function canBlockAttacker(blk, att){
  return !att.flying || !!(blk.flying || blk.reach);
}

/* Who takes how much damage in one block. Step 1: first strike and double strike.
   Step 2: regular damage from creatures still alive. Deathtouch (poison) kills on any damage. */
function fightOutcome(a, b){
  const aLeft = a.t - a.dmg, bLeft = b.t - b.dmg;
  let aIn = 0, bIn = 0;
  if(a.p > 0 && (a.firstStrike || a.doubleStrike)){ bIn += a.p; if(a.poison) bIn = Math.max(bIn, bLeft); }
  if(b.p > 0 && (b.firstStrike || b.doubleStrike)){ aIn += b.p; if(b.poison) aIn = Math.max(aIn, aLeft); }
  const aAlive = aIn < aLeft, bAlive = bIn < bLeft;
  if(a.p > 0 && (!a.firstStrike || a.doubleStrike) && aAlive){ bIn += a.p; if(a.poison) bIn = Math.max(bIn, bLeft); }
  if(b.p > 0 && (!b.firstStrike || b.doubleStrike) && bAlive){ aIn += b.p; if(b.poison) aIn = Math.max(aIn, aLeft); }
  return {aIn, bIn};
}

/* A gold spark flies from an attacker to its blocker, or to a player's life tile */
function flySpark(from, to, delay){
  const center = el => { const r = el.getBoundingClientRect(); return {x: r.left + r.width / 2, y: r.top + r.height / 2}; };
  const a = document.querySelector(`[data-id="${from.id}"]`);
  let b;
  if(to.field) b = document.querySelector(G.players.indexOf(to) === viewer() ? '#myTag' : '#oppTag');
  else b = document.querySelector(`[data-id="${to.id}"]`);
  if(!a || !b) return;
  const p0 = center(a), p1 = center(b);
  const dot = document.createElement('div');
  dot.className = 'spark';
  document.body.appendChild(dot);
  const anim = dot.animate([
    {transform: `translate(${p0.x - 5}px, ${p0.y - 5}px)`, opacity: 1},
    {transform: `translate(${p1.x - 5}px, ${p1.y - 5}px)`, opacity: 0.2}
  ], {duration: 320, delay, easing: 'ease-in', fill: 'backwards'});
  anim.onfinish = () => dot.remove();
}

function resolveCombat(){
  if(G.over || G.phase !== 'block' || G.stack.length) return;
  G.damageWindow = false;
  const me = cur(), def = opp();
  // Sparks start from the current table positions, before the damage re-renders the cards
  const sparkPairs = [];
  G.attackers.forEach(a => {
    if(!me.field.includes(a)) return;
    const bl = G.blocks.find(x => x.attacker === a);
    sparkPairs.push([a, bl ? bl.blocker : def]);
  });
  sparkPairs.forEach((pr, i) => flySpark(pr[0], pr[1], i * 150));
  G.attackers.forEach(a => {
    if(!me.field.includes(a)) return;
    let use = G.blocks.filter(x => x.attacker === a).map(x => x.blocker);
    if(a.menace && use.length === 1){ log(`${a.name} has menace and needed two blockers.`); use = []; }
    if(!use.length){
      def.life -= a.p;
      log(`${a.name} hit for ${a.p}.`);
      if(a.p) fx(def, '-' + a.p);
      if(a.lifelink && a.p){ me.life += a.p; fx(me, '+' + a.p); }
      return;
    }
    use.forEach((bl, i) => {
      const bLeft = bl.t - bl.dmg;
      // The attacker's damage goes to its first blocker; extra blockers only strike back
      const src = i === 0 ? a : {...a, p: 0, firstStrike: false, doubleStrike: false, poison: false};
      const r = fightOutcome(src, bl);
      bl.dmg += r.bIn; a.dmg += r.aIn;
      if(i === 0 && a.trample && a.p > bLeft){ const x = a.p - Math.max(0, bLeft); def.life -= x; fx(def, '-' + x); }
      if(i === 0 && a.lifelink && r.bIn){ me.life += r.bIn; fx(me, '+' + r.bIn); }
      if(bl.lifelink && r.aIn){ def.life += r.aIn; fx(def, '+' + r.aIn); }
      log(`${bl.name} blocked ${a.name}.`);
      if(r.bIn) fx(bl, '-' + r.bIn);
      if(r.aIn) fx(a, '-' + r.aIn);
    });
  });
  G.attackers = []; G.blocks = []; G.selBlocker = null; G.phase = 'main';
  G.combatDone = true;
  cleanup();
  if(G.vsAI && G.active !== G.human && !G.over) schedule(aiEnd, 800);
}

/* Combat tricks: after blocks, the attacker may act before damage. Skipped when nobody has an instant. */
function openDamageWindow(){
  if(G.over || G.phase !== 'block') return;
  const anyInstant = G.players.some(q => q.hand.some(c => c.instant && c.cost <= avail(q)));
  if(!anyInstant){ resolveCombat(); return; }
  G.damageWindow = true;
  G.priority = G.active;
  G.msg = '';
  if(G.vsAI && G.active !== G.human) schedule(aiDamagePass, 700);
}

/* Safety net, checked once a second: if the computer holds priority on the stack or in a damage window and
   nothing has happened for about two seconds, let it act again so the game can't freeze. */
setInterval(() => {
  if(G && G.over){ if(!G._saveCleared){ G._saveCleared = true; try{ localStorage.removeItem(SAVE_KEY); }catch(e){} } }
  else if(G) saveGame();
  if(!G || G.over || !G.vsAI) { if(G) G._stuck = 0; return; }
  const waiting = (G.stack.length || G.damageWindow) && G.priority !== G.human;
  if(waiting){
    G._stuck = (G._stuck || 0) + 1;
    if(G._stuck < 2) return;
    G._stuck = 0;
    if(G.stack.length) aiPriority(); else aiDamagePass();
    render();
    return;
  }
  // The computer's main phase has not moved for about three seconds: carry on with its attack / end step
  const sig = [G.turn, G.active, G.phase, G.stack.length, G.targeting ? 1 : 0, G.players.map(p => p.life + ':' + p.field.length + ':' + p.hand.length).join('|')].join('/');
  if(G.active !== G.human && G.phase === 'main' && !G.stack.length && !G.targeting){
    if(G._aiSig === sig) G._aiSame = (G._aiSame || 0) + 1; else { G._aiSame = 0; G._aiSig = sig; }
    if(G._aiSame >= 3){ G._aiSame = 0; aiAttack(); render(); }
  } else { G._aiSame = 0; }
  G._stuck = 0;
}, 1000);

function aiDamagePass(){
  if(G.over || !G.damageWindow || G.stack.length || G.priority === G.human) return;
  if(G.active !== G.human && aiTrick()) return;
  resolveCombat();
}

/* Floating numbers: a short "-3" over whatever took the change */
function fx(target, text){
  // soft tones: a low pluck for damage, a bright rise for life gained
  sfx(text[0] === '+' ? 'heal' : 'hit');
  target._good = text[0] === '+';
  if(target.life !== undefined && text[0] === '-' && G.stats) G.stats.dealt[1 - G.players.indexOf(target)] += parseInt(text.slice(1)) || 0;
  if(text[0] === '-') buzz(30);
  target._fx = text;
  target._hit = true; // the card shakes once when it takes damage
  setTimeout(() => { delete target._fx; delete target._hit; delete target._good; if(G) render(); }, 1100);
}

/* Turn banner: shows when the turn changes */
/* Turn banner: heading plus the hint in one card. The small hint pill is hidden while the card is up, so they never overlap. */
function showBanner(text, sub){
  const b = $('#banner'), h = $('#hint');
  if(!b || !settings.banner) return;
  const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  b.innerHTML = `<div class="bt">${esc(text)}</div>` + (sub ? `<div class="bs">${esc(sub)}</div>` : '');
  b.classList.toggle('show', true);
  if(h) h.style.visibility = 'hidden';
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => { b.classList.toggle('show', false); if(h) h.style.visibility = ''; }, 1600);
}

/* Lines on the table: a spell being chosen points at each legal target, a spell on the stack points at its target,
   and a blocker points at the attacker it blocks */
function drawArrows(){
  const svg = $('#arrows');
  if(!svg) return;
  svg.innerHTML = '';
  if(!G || !document.querySelectorAll) return;
  const rect = el => (el && el.getBoundingClientRect) ? el.getBoundingClientRect() : null;
  const at = r => ({x: r.left + r.width / 2, y: r.top + r.height / 2});
  const seg = (a, b, color, dashed) =>
    `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="3"${dashed ? ' stroke-dasharray="8 6"' : ''}/>` +
    `<circle cx="${b.x}" cy="${b.y}" r="6" fill="${color}"/>`;
  const q = sel => rect(document.querySelector(sel));
  let out = '';
  if(G.targeting){
    const hand = G.players[G.targeting.caster].hand;
    const src = q(`#myHand [data-i="${hand.indexOf(G.targeting.card)}"]`);
    if(src){
      const a = {x: src.left + src.width / 2, y: src.top};
      document.querySelectorAll('[data-act=creature]').forEach(el => { const r = rect(el); if(r) out += seg(a, at(r), '#f5c75a', true); });
    }
  }
  G.stack.forEach(e => {
    if(!e.target) return;
    const s1 = q(`#preview [data-card="${e.card.id}"]`), t = q(`[data-id="${e.target.id}"]`);
    if(s1 && t) out += seg(at(s1), at(t), '#ff8a7a', false);
  });
  G.blocks.forEach(b => {
    const d = q(`[data-id="${b.blocker.id}"]`), a = q(`[data-id="${b.attacker.id}"]`);
    if(d && a) out += seg(at(d), at(a), '#6fb8ff', false);
  });
  svg.innerHTML = out;
}

/* ---------- The stack: instants wait here, and the other player may answer before they resolve ---------- */

function pushStack(card, owner, target){
  sfx('spell');
  G.stack.push({card, owner, target});
  G.priority = 1 - owner;
  if(G.vsAI && G.priority !== G.human) schedule(aiPriority, 600);
}

function resolveTop(){
  sfx('chime');
  const e = G.stack.pop();
  if(!e) return;
  const p = G.players[e.owner], o = G.players[1 - e.owner];
  p.grave.push(e.card);
  const eff = e.card.effect;
  if(eff.counter){
    const tgt = G.stack.pop();
    if(tgt){ G.players[tgt.owner].grave.push(tgt.card); log(`${e.card.name} countered ${tgt.card.name}.`); }
    else log(`${e.card.name} had nothing to counter.`);
  } else if(eff.dmgCreature){
    if(e.target && G.players.some(q => q.field.includes(e.target))){
      e.target.dmg += eff.dmgCreature;
      fx(e.target, '-' + eff.dmgCreature);
      log(`${e.card.name} dealt ${eff.dmgCreature} to ${e.target.name}.`);
    } else {
      log(`${e.card.name} fizzled.`);
    }
  } else if(eff.pumpTurn){
    const t = e.target;
    if(t && G.players.some(q => q.field.includes(t))){
      t.p += eff.pumpTurn.p; t.tmpP = (t.tmpP || 0) + eff.pumpTurn.p;
      log(`${e.card.name} gave ${t.name} +${eff.pumpTurn.p}/+0 this turn.`);
    } else {
      log(`${e.card.name} fizzled.`);
    }
  } else {
    applyEffect(eff, p, o);
  }
  cleanup();
  checkWin();
  G.priority = G.active;
  if(G.over) return;
  if(!G.stack.length && G.endPending){ G.endPending = false; finishOrDiscard(); return; }
  if(G.damageWindow && !G.stack.length && G.vsAI && G.active !== G.human) schedule(aiDamagePass, 600);
  if(G.vsAI && G.stack.length && G.priority !== G.human) schedule(aiPriority, 600);
}

function stackHtml(){
  return `<div class="stackrow"><span>Stack</span>${G.stack.slice().reverse().map(e => cardEl(e.card, {mini: true})).join('')}</div>`;
}

/* The computer answers with an instant if it can, otherwise lets the spell resolve */
function aiPriority(){
  if(G.over || !G.stack.length || G.priority === G.human) return;
  const ai = G.players[1 - G.human], hu = G.players[G.human];
  const i = ai.hand.findIndex(c => c.instant && c.cost <= avail(ai) && !c.effect.pumpTurn && !(c.effect.counter && (!G.stack.length || G.stack[G.stack.length - 1].owner !== G.human)) && (!c.effect.dmgCreature || hu.field.length));
  if(i < 0){ resolveTop(); return; }
  aiCast(i);
}

function aiCast(i){
  const me = 1 - G.human, ai = G.players[me], hu = G.players[G.human];
  const c = ai.hand[i];
  ai.hand.splice(i, 1); ai.spent += c.cost;
  if(c.effect.dmgCreature){
    const sorted = [...hu.field].sort((a, b) => b.p - a.p);
    const t = sorted.find(x => x.t - x.dmg <= c.effect.dmgCreature) || sorted[0];
    log(`⚡ ${ai.name} cast ${c.name} at ${t.name}.`);
    pushStack(c, me, t);
  } else {
    log(`⚡ ${ai.name} cast ${c.name}.`);
    pushStack(c, me, null);
  }
}

/* ---------- Computer opponent ---------- */

function aiTarget(dmg){
  const enemies = [...opp().field].filter(c => !c.hexproof);
  if(!enemies.length) return null;
  const kill = enemies.filter(c => c.t - c.dmg <= dmg).sort((a, b) => b.p - a.p)[0];
  return kill || enemies.sort((a, b) => b.p - a.p)[0];
}

function aiMain(){
  if(G.over || G.phase !== 'main' || G.active === G.human) return;
  if(G.stack.length){ schedule(aiMain, 700); return; }
  if(G.targeting){ schedule(aiMain, 700); return; }
  const p = cur();
  const li = p.hand.findIndex(c => c.type === 'land');
  if(li >= 0 && p.landsPlayed < 1){ playCard(li); schedule(aiMain, 700); return; }

  let best = null;
  p.hand.forEach((c, i) => {
    if(c.type === 'land' || c.instant || c.cost > avail(p)) return;
    if(c.effect && c.effect.dmgCreature && !aiTarget(c.effect.dmgCreature)) return;
    if(c.effect && c.effect.aura && !p.field.length) return;
    if(!best || c.cost > best.c.cost) best = {c, i};
  });
  if(best){
    if(best.c.effect && best.c.effect.dmgCreature){
      G.targeting = {card: best.c, caster: G.active};
      resolveTarget(aiTarget(best.c.effect.dmgCreature));
    } else if(best.c.effect && best.c.effect.aura){
      G.targeting = {card: best.c, caster: G.active};
      resolveTarget([...p.field].sort((a, b) => b.p - a.p)[0]);
    } else {
      playCard(best.i);
    }
    schedule(aiMain, 700);
    return;
  }
  schedule(aiAttack, 700);
}

function aiAttack(){
  if(G.over || G.phase !== 'main' || G.active === G.human) return;
  if(G.stack.length){ schedule(aiAttack, 700); return; }
  const p = cur(), o = opp();
  const blockers = o.field.filter(c => !c.tapped);
  const total = p.field.filter(canAttack).reduce((s, c) => s + c.p, 0);
  // Only blockers that can legally block this creature count (flying, reach, menace)
  const safe = c => {
    const bl = blockers.filter(b => canBlockAttacker(b, c));
    if(c.menace) return bl.length < 2 || total >= o.life;
    if(!bl.length || total >= o.life) return true;
    if((c.firstStrike || c.doubleStrike) && bl.every(b => b.p < c.t)) return true;
    return c.t > Math.max(...bl.map(b => b.p));
  };
  const atk = p.field.filter(c => canAttack(c) && safe(c));
  if(G.combatDone || !atk.length){ schedule(aiEnd, 600); return; }
  G.attackers = atk;
  declareAttack();
}

function aiBlock(){
  const ai = opp();
  const incoming = G.attackers.reduce((s, a) => s + a.p, 0);
  const danger = incoming >= ai.life;
  const sorted = [...G.attackers].sort((a, b) => b.p - a.p);
  for(const a of sorted){
    if(a.menace) continue; // the AI does not double-block
    const free = ai.field.filter(b => !b.tapped && !G.blocks.some(x => x.blocker === b) && canBlockAttacker(b, a));
    if(!free.length) continue;
    const pick = free.find(b => b.t > a.p && b.p >= a.t)
              || free.find(b => b.p >= a.t)
              || (danger ? [...free].sort((x, y) => x.p - y.p)[0] : null);
    if(pick) G.blocks.push({attacker: a, blocker: pick});
  }
}

function aiEnd(){
  if(G.over || G.active === G.human) return;
  if(G.stack.length){ schedule(aiEnd, 700); return; }
  endTurn();
}

/* ---------- Rendering ---------- */

function usableAbilities(){
  const p = cur();
  return p.field.filter(c => c.ability && !c.tapped && !c.sick && c.ability.cost <= avail(p));
}
function equipHost(){ return cur().field.find(c => (c.attached || []).some(a => a.equip)); }
/* Equip only makes sense when there is equipment to move, the Essence to pay, and another creature to move it to */
function equipReady(){
  const host = equipHost();
  return !!host && avail(cur()) >= 1 && cur().field.some(c => c !== host && c.type === 'creature');
}
function useAbility(){
  if(G.over || G.phase !== 'main' || G.targeting || G.stack.length) return;
  const src = usableAbilities()[0];
  if(!src){ G.msg = 'No ability can be used right now.'; return; }
  const a = src.ability, p = cur();
  p.spent += a.cost; src.tapped = true; sfx('tick');
  if(a.heal){ p.life += a.heal; fx(p, '+' + a.heal); log(`${src.name} gained ${a.heal} life.`); }
  else if(a.counter){ src.p += 1; src.t += 1; src.counters = (src.counters || 0) + 1; log(`${src.name} gets a +1/+1 counter.`); }
  else if(a.dmgCreature){ G.targeting = {abilityOf: src, caster: G.active}; G.msg = ''; }
}
function useEquip(){
  if(G.over || G.phase !== 'main' || G.targeting || G.stack.length) return;
  const host = equipHost();
  if(!host){ G.msg = 'No equipment to move.'; return; }
  if(avail(cur()) < 1){ G.msg = 'Needs 1 Essence.'; return; }
  G.targeting = {equip: host.attached.find(a => a.equip), caster: G.active}; G.msg = '';
}

/* Flash creatures enter at instant speed, without using the stack */
function flashCast(i, p){
  const c = p.hand[i];
  if(!c) return;
  if(c.cost > avail(p)){ G.msg = `Needs ${c.cost} Essence.`; return; }
  p.hand.splice(i, 1); p.spent += c.cost; c.sick = !c.haste;
  if(c.legendary) p.field.unshift(c); else p.field.push(c); applyLords();
  log(`${p.name} flashed in ${c.name}.`); sfx('tick');
  if(c.onEnter) applyEffect(c.onEnter, p, opp(), c);
  checkWin();
}

/* The computer uses Battle Cry on its strongest creature while it attacks */
function aiTrick(){
  const ai = G.players[1 - G.human];
  const i = ai.hand.findIndex(c => c.effect && c.effect.pumpTurn && c.cost <= avail(ai));
  if(i < 0) return false;
  const mine = G.attackers.filter(c => ai.field.includes(c)).sort((a, b) => b.p - a.p);
  if(!mine.length) return false;
  const c = ai.hand.splice(i, 1)[0];
  ai.spent += c.cost;
  log(`⚡ ${ai.name} cast ${c.name} on ${mine[0].name}.`);
  pushStack(c, 1 - G.human, mine[0]);
  return true;
}

function playable(c, p, v){
  if(G.targeting || G.over) return false;
  if(c.flash && c.type === 'creature') return (G.phase === 'main' || G.phase === 'block') && c.cost <= avail(p);
  if(c.instant) return (G.phase === 'main' || G.phase === 'block') && c.cost <= avail(p);
  return G.phase === 'main' && G.active === v &&
    (c.type === 'land' ? p.landsPlayed < 1 : c.cost <= avail(p));
}

/* Instants can be cast on either player's turn, using untapped Essence */
function castInstant(i, p){
  const c = p.hand[i];
  if(!c) return;
  if(c.cost > avail(p)){ G.msg = `Needs ${c.cost} Essence.`; return; }
  const me = G.players.indexOf(p);
  if(G.stack.length && G.priority !== me){ G.msg = 'Wait: the other player has priority.'; return; }
  if(c.effect.counter && !G.stack.length){ G.msg = 'Nothing to counter.'; return; }
  if(c.effect.dmgCreature || c.effect.pumpTurn){
    if(!G.players.some(q => q.field.length)){ G.msg = 'No creatures on the table to target yet.'; return; }
    G.targeting = {card: c, caster: me};
    return;
  }
  p.hand.splice(i, 1); p.spent += c.cost;
  log(`⚡ ${p.name} cast ${c.name}.`);
  pushStack(c, me, null);
}

function handleHand(i){
  if(G.over) return;
  const v = viewer(), p = G.players[v], c = p.hand[i];
  if(!c) return;
  if(G.discardNeed){
    if(v !== G.active) return;
    p.hand.splice(i, 1); p.grave.push(c);
    log(`${p.name} discards ${c.name}.`);
    if(--G.discardNeed === 0) finishEnd();
    return;
  }
  if(c.flash && c.type === 'creature' && !G.discardNeed){
    if(G.phase === 'main' || G.phase === 'block') flashCast(i, p);
    return;
  }
  if(c.instant){
    if(G.phase === 'main' || G.phase === 'block') castInstant(i, p);
    return;
  }
  if(G.active !== v){ G.msg = 'That can only be played on your turn.'; return; }
  playCard(i);
}

/* The computer casts an instant at the end of your turn when it can */
function aiInstantAtEnd(){
  const ai = G.players[1 - G.human], hu = G.players[G.human];
  const i = ai.hand.findIndex(c => c.instant && c.cost <= avail(ai) && !c.effect.pumpTurn && !(c.effect.counter && (!G.stack.length || G.stack[G.stack.length - 1].owner !== G.human)) && (!c.effect.dmgCreature || hu.field.length));
  if(i >= 0) aiCast(i);
}

function cardEl(c, o = {}){
  const land = c.type === 'land';
  const blocking = G.blocks.some(b => b.attacker === c || b.blocker === c) || G.selBlocker === c;
  const arriving = o.act === 'creature' && !c._seen; // a creature is shown on the table for the first time
  if(arriving){ c._seen = true; sfx('tick'); }
  const cls = ['card', c.faction, land ? 'land' : '', (c.tapped || o.tapped) ? 'tapped' : '',
    G.attackers.includes(c) ? 'sel' : '', blocking ? 'blocker' : '',
    o.target ? 'target' : '', o.dim ? 'dim' : '', o.act ? 'clickable' : '', o.mini ? 'mini' : '', o.spent ? 'spent' : '',
    arriving ? 'arrive' : '', c._hit ? 'hit' : '', c._lunge ? 'lunge-' + c._lunge : '', o.ghost ? 'ghost' : '', c.legendary ? 'legendary' : ''].filter(Boolean).join(' ');
  let attrs = '';
  if(o.act === 'hand') attrs = `data-act="hand" data-i="${o.i}" ${CAN_DRAG ? 'draggable="true"' : ''}`;
  else if(o.act) attrs = `data-act="creature" data-id="${c.id}" data-owner="${o.owner}" ${CAN_DRAG ? 'draggable="true"' : ''}`;
  const cost = land ? '' : `<span class="cost">${c.cost}</span>`;
  const badge = land ? '' : (c.type === 'spell' ? (c.instant ? '<span class="badge">⚡</span>' : '<span class="badge">✨</span>') : '');
  const pt = c.type === 'creature' ? `<div class="pt"><span>⚔️${c.p}</span><span>♥${c.t}</span></div>` : (!o.mini ? '<div class="pt" aria-hidden="true" style="visibility:hidden"><span>0</span></div>' : '');
  const dmg = c.dmg ? `<span class="dmg">💥${c.dmg}</span>` : '';
  const ctr = c.counters ? `<span class="ctr" title="+1/+1 counters">+${c.counters}</span>` : '';
  const ench = (c.attached && c.attached.length) ? `<span class="ench" title="Has an aura">🪵${c.attached.length}</span>` : '';
  const sick = c.sick && o.owner === viewer() ? '<span class="sick" title="Summoning sick">💤</span>' : '';
  const fxHtml = c._fx ? `<span class="fx">${c._fx}</span>` : '';
  const kindName = land ? 'Land' : c.type === 'equipment' ? 'Equipment' : c.type === 'creature' ? (c.legendary ? 'Legendary' : 'Creature') : c.type === 'artifact' ? 'Artifact'
                 : (c.effect && c.effect.aura) ? 'Aura' : c.instant ? 'Instant' : 'Sorcery';
  const tline = (land || o.mini) ? '' : `<div class="tline">${kindName}</div>`;
  const facHtml = (!land && !o.mini && c.type === 'creature') ? `<span class="fac" title="${FAC_NAME[c.faction]}">${FAC_ICON[c.faction]}</span>` : '';
  return `<div class="${cls}" ${attrs} data-card="${c.id}">${cost}${badge}${facHtml}${dmg}${ench}${ctr}${sick}${fxHtml}${c.tapped ? `<span class="tapb" title="Tapped">${ico('tap', 14)}</span>` : ''}` +
         `<div class="art">${c.art}</div>${tline}${abilHtml(c)}<div class="nm">${c.name}</div>${pt}</div>`;
}

function pileHtml(p){
  if(!p.lands.length) return '';
  const VIS = 5, STEP = 14;
  const n = p.lands.length, tapped = Math.min(p.spent, n);
  const shown = p.lands.slice(Math.max(0, n - VIS));
  const k = shown.length, hidden = n - k;
  let cards = '';
  shown.forEach((land, j) => {
    const idx = n - k + j;
    cards += `<div class="lcard" style="top:${j * STEP}px;z-index:${j + 1}">${cardEl(land, {mini: true, tapped: idx >= n - tapped})}</div>`;
  });
  const av = avail(p), total = n + p.field.reduce((s, c) => s + c.ramp, 0);
  const who = p === G.players[viewer()] ? 'Your' : 'Opponent';
  return `<div class="pile" title="${who} Essence: ${av} of ${total}" style="height:calc(var(--cw)*.86 + ${(k - 1) * STEP}px)">${cards}` +
         (hidden ? `<span class="more">+${hidden}</span>` : '') + `</div>`;
}

function fieldHtml(p, idx){
  const creatures = p.field.map(c => cardEl(c, {act: 'creature', owner: idx, target: !!G.targeting})).join('');
  const ghosts = GHOSTS.filter(g => g.owner === idx).map(g => cardEl(g.card, {ghost: true})).join('');
  return `<div class="lane">${pileHtml(p)}${creatures}${ghosts}</div>`;
}

function tagHtml(p, isActive){
  const low = p.life <= 5 ? 'low' : '';
  const idx = G.players.indexOf(p);
  return `<div class="tag ${isActive ? 'active' : ''}">` +
    `<div class="dpile" title="Cards left in deck"><span class="dback"></span><span class="dback"></span><b class="dcount">${p.library.length}</b></div>` +
    `<div class="gpile" data-act="viewgrave" data-p="${idx}" title="Graveyard"><span class="dback g"></span><b class="dcount">${p.grave.length}</b></div>` +
    `<div class="life ${low} ${p._hit ? (p._good ? 'healed' : 'hitlife') : ''}" title="Life"><small>Life</small><b>${p.life}</b>${p._fx ? `<span class="fx">${p._fx}</span>` : ''}</div>` +
  `</div>`;
}

function phaseHtml(){
  let step = 'Main 1';
  if(G.discardNeed || G.endPending) step = 'End';
  else if(G.phase === 'block' || G.attackers.length) step = 'Combat';
  else if(G.combatDone) step = 'Main 2';
  const turnOwner = G.vsAI ? (G.active === G.human ? 'Your turn' : 'Computer’s turn') : `${cur().name}’s turn`;
  const steps = ['Untap', 'Draw', 'Main 1', 'Combat', 'Main 2', 'End'];
  const track = steps.map(s => `<span class="${s === step ? 'on' : ''}">${s}</span>`).join('');
  return `<div class="phase"><div class="turnline">${turnOwner} · Round ${G.turn}</div><div class="track">${track}</div></div>`;
}

function hintHtml(){
  if(G.over) return '';
  if(G.stack.length){
    const top = G.stack[G.stack.length - 1], who = G.players[top.owner].name;
    return G.priority === viewer() ? `${who} cast ${top.card.name}. Respond with an instant, or resolve it`
                                   : `${who} cast ${top.card.name}. Computer may respond…`;
  }
  if(G.discardNeed) return `Discard ${G.discardNeed} card${G.discardNeed > 1 ? 's' : ''} to hand size 7`;
  if(G.damageWindow) return G.priority === viewer() ? 'Cast a trick, or deal damage' : 'Computer may respond…';
  if(G.msg) return G.msg;
  if(G.vsAI && G.phase === 'main' && G.active !== G.human) return 'Computer is playing…';
  if(G.vsAI && G.phase === 'block' && G.active === G.human) return 'Computer is choosing blockers…';
  if(G.targeting) return 'Pick a creature to target';
  if(G.phase === 'block') return 'Tap your creature, then the attacker it blocks';
  if(G.attackers.length) return `${G.attackers.length} attacking`;
  if(G.combatDone) return 'Combat is over. Pass your turn';
  return cur().landsPlayed >= 1 ? 'Attack with your creatures, or pass' : 'Play a land or a card, or pick attackers';
}

function actionsHtml(){
  const attackReady = G.phase === 'main' && G.attackers.length > 0;
  const blockReady = G.phase === 'block';
  const endReady = G.phase === 'main' && !G.attackers.length && !G.targeting;
  const btn = (act, label, icon, glow, cls = '', dis = false) =>
    `<button class="act ${glow ? 'glow' : ''} ${cls}" data-act="${act}" title="${label}" aria-label="${label}" ${dis ? 'disabled' : ''}>` +
    `${ico(icon, 22)}<span>${label}</span></button>`;
  if(G.stack.length) return G.priority === viewer() ? btn('letresolve', 'Resolve', 'end', true) : '';
  if(G.damageWindow) return G.priority === viewer() ? btn('dmg', 'Damage', 'attack', true) : '';
  if(G.discardNeed) return '';
  const allReady = G.phase === 'main' && !G.combatDone && !G.targeting && cur().field.some(c => canAttack(c) && !G.attackers.includes(c));
  return btn('attack', 'Attack', 'attack', attackReady) +
         (G.phase === 'main' ? btn('attackall', 'Attack all', 'swords', allReady, 'wide') : '') +
         (G.phase === 'main' ? btn('ability', 'Ability', 'tap', usableAbilities().length > 0, '', !usableAbilities().length) : '') +
         (G.phase === 'main' ? btn('equip', 'Equip', 'equip', equipReady(), '', !equipReady()) : '') +
         btn('resolve', 'Confirm', 'shield', blockReady) +
         btn('cancel', 'Cancel', 'undo', false, 'danger') +
         btn('end', 'Pass', 'end', endReady);
}

/* Combat preview: what happens to each attacker with the blocks chosen so far */
function blockPreviewHtml(){
  if(G.over || G.phase !== 'block') return '';
  const lines = G.attackers.map(a => {
    const b = G.blocks.find(x => x.attacker === a);
    if(!b) return `${a.name} hits for ${a.p}`;
    const r = fightOutcome(a, b.blocker);
    const aDies = a.dmg + r.aIn >= a.t;
    const bDies = b.blocker.dmg + r.bIn >= b.blocker.t;
    const res = aDies && bDies ? 'both die' : aDies ? `${a.name} dies` : bDies ? `${b.blocker.name} dies` : 'both survive';
    return `${b.blocker.name} blocks ${a.name}: ${res}`;
  });
  const hint = G.selBlocker ? `Now click an attacker for ${G.selBlocker.name}` : '';
  return lines.join('<br>') + (hint ? `<br><i>${hint}</i>` : '');
}

/* Auto-pass: if you have nothing you can do this turn, pass after a short pause */
function nothingToDo(){
  if(!G || G.over || G.phase !== 'main' || G.active !== G.human || G.targeting || G.mull || G.stack.length) return false;
  const p = G.players[G.human];
  if(p.landsPlayed < 1 && p.hand.some(c => c.type === 'land')) return false;
  if(p.hand.some(c => c.type !== 'land' && playable(c, p, G.human))) return false;
  if(p.field.some(canAttack)) return false;
  return true;
}
function scheduleAutoPass(){
  if(autoTimer || !G || !G.vsAI || !nothingToDo()) return;
  $('#hint').textContent = 'Nothing to do. Passing…';
  autoTimer = setTimeout(() => {
    autoTimer = null;
    if(nothingToDo()){ endTurn(); render(); }
  }, 1400);
}

  $('#homeIcon').innerHTML = ico('home', 22);
  $('#logIcon').innerHTML = ico('log', 22);

  if(!G){
    ['#phase', '#oppTag', '#oppHand', '#oppField', '#hint', '#myField', '#myTag', '#actions', '#myHand', '#log']
      .forEach(s => H(s).innerHTML = '');
    $('#logdrawer').classList.remove('open'); // the log only belongs to a game, so close it on the start screen
    renderInspect();
    return;
  }

  const bk = G.turn + ':' + G.active;
  if(G.bannerKey !== bk && !G.showPass && !G.mull){ // no banner on top of a hand-over or coin/mulligan screen; it shows after those
    G.bannerKey = bk;
    showBanner(G.vsAI ? (G.active === G.human ? 'Your turn' : 'Computer’s turn') : `${cur().name}’s turn`, hintHtml());
  }
  const v = viewer();
  const V = G.players[v], O = G.players[1 - v];
  H('#phase').innerHTML = phaseHtml();
  H('#oppTag').innerHTML = tagHtml(O, G.active === 1 - v);
  H('#oppHand').innerHTML = O.hand.map(() => '<div class="card back"></div>').join('') +
    `<span class="count" title="Cards in opponent's hand">${O.hand.length}</span>`;
  H('#oppField').innerHTML = fieldHtml(O, 1 - v);
  $('#hint').textContent = hintHtml();
  H('#myField').innerHTML = fieldHtml(V, v);
  H('#myTag').innerHTML = tagHtml(V, G.active === v);
  H('#myHand').innerHTML = V.hand.map((c, i) => cardEl(c, {act: 'hand', i, dim: !playable(c, V, v), spent: c.type === 'land' && V.landsPlayed >= 1 && G.active === v})).join('');
  H('#actions').innerHTML = actionsHtml();
  H('#log').innerHTML = G.log.slice(-80).reverse().map(l => `<div>${l}</div>`).join('');
  renderInspect();

  const live = !G.over && !busy();
  const setDis = (sel, v) => { const el = $(sel); if(el) el.disabled = v; };
  setDis('[data-act=attack]', !live || G.phase !== 'main' || !G.attackers.length || !!G.targeting || G.stack.length > 0 || G.combatDone || G.discardNeed > 0);
  setDis('[data-act=attackall]', !live || G.phase !== 'main' || !!G.targeting || G.stack.length > 0 || G.combatDone || G.discardNeed > 0 || !cur().field.some(c => canAttack(c) && !G.attackers.includes(c)));
  setDis('[data-act=resolve]', !live || G.phase !== 'block' || G.stack.length > 0 || G.damageWindow);
  setDis('[data-act=end]', !live || G.phase !== 'main' || G.stack.length > 0 || G.discardNeed > 0);
  setDis('[data-act=cancel]', !G.targeting); // always cancellable while choosing a target, even on the computer's turn
  $('#preview').innerHTML = G ? (G.stack.length ? stackHtml() : blockPreviewHtml()) : '';
  drawArrows();
  scheduleAutoPass();
}

/* ---------- Input ---------- */

document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-card]');
  if(!el) return;
  const c = ALL.get(+el.dataset.card);
  if(c && c !== preview){ preview = c; renderInspect(); }
});

/* Drag a card from your hand onto the table to play it, or drag a creature onto the opponent to attack */
document.addEventListener('dragstart', e => {
  const el = e.target.closest && e.target.closest('[data-act]');
  if(!el || !G) return;
  if(el.dataset.act === 'hand') dragSrc = {kind: 'hand', i: +el.dataset.i};
  else if(el.dataset.act === 'creature') dragSrc = {kind: 'creature', id: +el.dataset.id};
  else return;
  e.dataTransfer.setData('text/plain', 'card');
});
document.addEventListener('dragend', () => { dragSrc = null; });
document.addEventListener('dragover', e => {
  if(dragSrc && e.target.closest && e.target.closest('#myField,#oppField,[data-act=creature]')) e.preventDefault();
});
document.addEventListener('drop', e => {
  if(!dragSrc || !G) return;
  e.preventDefault();
  const src = dragSrc; dragSrc = null;
  clearTimeout(autoTimer); autoTimer = null;
  G.msg = '';
  const crEl = e.target.closest('[data-act=creature]');
  const target = crEl ? findCreature(+crEl.dataset.id) : null;
  const v = viewer();
  if(src.kind === 'hand'){
    if(target){
      handleHand(src.i);
      if(G.targeting) creatureClick(target, +crEl.dataset.owner);
    } else if(e.target.closest('#myField')){
      handleHand(src.i);
    }
  } else if(src.kind === 'creature'){
    const c = findCreature(src.id);
    const onOpp = e.target.closest('#oppField') || (crEl && +crEl.dataset.owner === 1 - v);
    if(c && onOpp && G.players[v].field.includes(c) && G.phase === 'main' && G.active === v && !G.combatDone){
      if(canAttack(c) && !G.attackers.includes(c)) G.attackers.push(c);
      else if(!canAttack(c)) G.msg = `${c.name} can't attack.`;
    }
  }
  render();
});

/* Saving: the game is kept in this browser and resumed from the start screen.
   Only saved between actions (not mid-attack or mid-spell), so the saved state is always complete. */
const SAVE_KEY = 'warren-grove-save';
let lastSaved = null;
function saveable(){
  return G && !G.over && !G.targeting && !G.stack.length && !G.blocks.length && !G.attackers.length &&
         !G.showPass && !G.mull && !G.damageWindow && !G.selBlocker && !G.discardNeed;
}
function saveGame(){
  if(!saveable()) return;
  try{
    const json = JSON.stringify(G);
    if(json !== lastSaved){ localStorage.setItem(SAVE_KEY, json); lastSaved = json; }
  }catch(e){}
}
function hasSave(){
  try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; }
}
function loadGame(){
  try{
    const o = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(!o || !o.players) return;
    G = o; ALL.clear();
    let max = 0;
    G.players.forEach(p => ['library','hand','field','grave','lands'].forEach(z => p[z].forEach(c => { ALL.set(c.id, c); max = Math.max(max, c.id); (c.attached || []).forEach(a => { ALL.set(a.id, a); max = Math.max(max, a.id); }); })));
    uid = max + 1;
    Object.assign(G, {attackers: [], blocks: [], stack: [], selBlocker: null, targeting: null, showPass: null, damageWindow: false, bannerKey: null});
    G.discardNeed = G.discardNeed || 0;
    G.stats = G.stats || {dealt: [0, 0], drawn: [0, 0]};
    menu = {mode: null, picks: []}; viewGrave = null; preview = null; lastSaved = null;
  }catch(e){ G = null; }
}

function handleMenu(act, el){
  if(act === 'menuai') menu = {mode: 'ai', picks: []};
  else if(act === 'menuhot') menu = {mode: 'hot', picks: []};
  else if(act === 'menuback') menu = {mode: null, picks: []};
  else if(act === 'menuguide') menu = {mode: 'guide', picks: []};
  else if(act === 'menuinstall') menu = {mode: 'install', picks: []};
  else if(act === 'installnow'){ if(deferredInstall){ const d = deferredInstall; deferredInstall = null; d.prompt(); } }
  else if(act === 'togglebanner') settings.banner = !settings.banner;
  else if(act === 'cycletheme'){ settings.theme = THEME_NEXT[settings.theme]; applyTheme(); }
  else if(act === 'togglesound'){ settings.sound = !settings.sound; if(settings.sound) { unlockAudio(); sfx('chime'); } }
  else if(act === 'togglevib'){ settings.vib = !settings.vib; buzz(30); }
  else if(act === 'resume'){ loadGame(); }
  else if(act === 'pickdeck'){
    menu.picks.push(el.dataset.f);
    if(menu.mode === 'ai'){
      const others = ['goblin', 'elf', 'zombie', 'knight', 'dragon', 'merfolk'].filter(f => f !== menu.picks[0]);
      const comp = others[Math.floor(Math.random() * others.length)];
      menu = {mode: null, picks: []};
      startGame(true, 0, [el.dataset.f, comp]);
    } else if(menu.picks.length === 2){
      const picks = menu.picks;
      menu = {mode: null, picks: []};
      startGame(false, 0, picks);
    }
  }
}

function findCreature(id){ return G ? G.players.flatMap(p => p.field).find(x => x.id === id) : null; }

/* Hold a card on a phone (or touch screen) to read its abilities */
document.addEventListener('pointerdown', e => {
  pressed = false;
  pointerDown = true;
  clearTimeout(pressTimer);
  const el = e.target.closest('[data-card]');
  if(!el || !G) return;
  pressTimer = setTimeout(() => {
    pressed = true;
    pointerDown = false; // the detail view must show while the finger is still down
    detailCard = ALL.get(+el.dataset.card) || null;
    render();
  }, 450);
});
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => {
  clearTimeout(pressTimer);
  pointerDown = false;
  if(renderPending){ renderPending = false; setTimeout(() => render(), 60); }
}));

document.addEventListener('click', e => {
  if(pressed){ pressed = false; return; }
  const el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  const act = el.dataset.act;
  clearTimeout(autoTimer); autoTimer = null;

  if(act === 'log'){ $('#logdrawer').classList.toggle('open'); return; }
  if(act === 'closedetail'){ detailCard = null; render(); return; }
  if(['menuai', 'menuhot', 'menuback', 'pickdeck', 'menuguide', 'menuinstall', 'installnow', 'togglebanner', 'cycletheme', 'togglesound', 'togglevib', 'resume'].includes(act)){ handleMenu(act, el); render(); return; }
  if(act === 'new'){ G = null; menu = {mode: null, picks: []}; viewGrave = null; render(); return; }
  if(act === 'rematch' && G && G.over){ const v = G.vsAI, f = G.factions; viewGrave = null; startGame(v, 0, f); render(); return; }
  if(act === 'viewgrave'){ viewGrave = +el.dataset.p; render(); return; }
  if(act === 'closegrave'){ viewGrave = null; render(); return; }
  const allowed = act === 'hand' || act === 'cancel' || act === 'letresolve' || act === 'mullstart' || act === 'keep' || act === 'mull' || act === 'kw' || (act === 'creature' && G.targeting);
  if(!G || (busy() && !allowed)) return;

  if(el.dataset.card){ const c = ALL.get(+el.dataset.card); if(c) preview = c; }
  const kwEl = e.target.closest ? e.target.closest('[data-kw]') : null;
  const kwMsg = kwEl ? ABIL_LABEL[kwEl.dataset.kw] : null;
  G.msg = '';
  switch(act){
    case 'hand': handleHand(+el.dataset.i); break;
    case 'creature': {
      const c = G.players.flatMap(p => p.field).find(x => x.id === +el.dataset.id);
      if(c) creatureClick(c, +el.dataset.owner);
      break;
    }
    case 'attack': declareAttack(); break;
    case 'ability': useAbility(); break;
    case 'equip': useEquip(); break;
    case 'attackall': attackAllCreatures(); break;
    case 'resolve': if(G.damageWindow) resolveCombat(); else openDamageWindow(); break;
    case 'dmg': resolveCombat(); break;
    case 'end': endTurn(); break;
    case 'cancel':
      if(G.targeting && G.targeting.abilityOf){ // give back the cost of an ability that was not used
        const P = G.players[G.targeting.caster];
        P.spent -= G.targeting.abilityOf.ability.cost; G.targeting.abilityOf.tapped = false;
      }
      G.targeting = null; break;
    case 'ready': G.showPass = null; G.revealedFor = viewer(); break;
    case 'kw': break;
    case 'letresolve': resolveTop(); break;
    case 'mullstart': G.mull.stage = 'decide'; mullStep(); break;
    case 'keep': G.mull.k++; mullStep(); break;
    case 'mull': mulligan(G.mull.order[G.mull.k]); break;
  }
  if(kwMsg){ G.msg = kwMsg; setTimeout(() => { if(G && G.msg === kwMsg){ G.msg = ''; render(); } }, 2200); }
  render();
});

render();

/* Shared steel-and-bronze shield logo. cls sets the size class, idp keeps clip-path ids unique. */
function warLogo(cls, idp){
  const SHIELD = 'M0 0 H100 V60 Q100 100 50 120 Q0 100 0 60 Z';
  const wedgeList = [['#4a525a','50,60 50,-140 223.2,-40'], ['#2c3238','50,60 223.2,-40 223.2,160'], ['#5d666e','50,60 223.2,160 50,260'], ['#353c43','50,60 50,260 -123.2,160'], ['#4d4944','50,60 -123.2,160 -123.2,-40'], ['#2c2a27','50,60 -123.2,-40 50,-140']];
  const wedges = wedgeList.map((w, i) => `<polygon class="wedge" style="--d:${(1.6 + i * 0.08).toFixed(2)}s" points="${w[1]}" fill="${w[0]}"/>`).join('');
  const steel = 'stroke="#c9d0d6" fill="#c9d0d6"';
  const glyphDefs = `
    <g id="sp-axe"><line x1="-2" y1="12" x2="-2" y2="-10" stroke="#c9d0d6" stroke-width="3" stroke-linecap="round"/><path d="M-2 -12 L8 -8 L8 2 L-2 -2 Z" fill="#c9d0d6"/></g>
    <g id="sp-bow"><path d="M-8 -12 Q8 0 -8 12" fill="none" stroke="#c9d0d6" stroke-width="3" stroke-linecap="round"/><line x1="-8" y1="-12" x2="-8" y2="12" stroke="#c9d0d6" stroke-width="1"/></g>
    <g id="sp-scythe"><line x1="-7" y1="12" x2="1" y2="-12" stroke="#c9d0d6" stroke-width="3" stroke-linecap="round"/><path d="M1 -12 Q11 -10 9 2" fill="none" stroke="#c9d0d6" stroke-width="3" stroke-linecap="round"/></g>
    <g id="sp-lance"><line x1="0" y1="12" x2="0" y2="-8" stroke="#c9d0d6" stroke-width="3" stroke-linecap="round"/><polygon points="0,-14 4,-8 -4,-8" fill="#c9d0d6"/></g>
    <g id="sp-claw"><path d="M-7 -10 Q-9 0 -4 10" fill="none" stroke="#c9d0d6" stroke-width="2.5" stroke-linecap="round"/><path d="M0 -12 Q-2 0 2 10" fill="none" stroke="#c9d0d6" stroke-width="2.5" stroke-linecap="round"/><path d="M7 -10 Q9 0 4 10" fill="none" stroke="#c9d0d6" stroke-width="2.5" stroke-linecap="round"/></g>
    <g id="sp-trident"><line x1="0" y1="12" x2="0" y2="-4" stroke="#c9d0d6" stroke-width="3" stroke-linecap="round"/><path d="M-7 -13 L-7 -4 Q0 0 7 -4 L7 -13" fill="none" stroke="#c9d0d6" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="-4" x2="0" y2="-14" stroke="#c9d0d6" stroke-width="2.5"/></g>`;
  // Each weapon: final spot in its wedge, and the offset it flies in from (its nearest side)
  const weapons = [
    ['axe', 66, 29, 22.5, -39, 1.9], ['bow', 84, 60, 45, 0, 2.0], ['scythe', 65, 91, 22.5, 39, 2.1],
    ['lance', 32, 91, -22.5, 39, 2.2], ['claw', 14, 60, -45, 0, 2.3], ['trident', 32, 29, -22.5, -39, 2.4]
  ].map(([id, x, y, fx, fy, d]) => `<g class="w" style="--fx:${fx}px;--fy:${fy}px;--d:${d}s"><use href="#sp-${id}" transform="translate(${x},${y}) scale(0.8)"/></g>`).join('');
  return `<svg class="${cls}" viewBox="0 0 100 120" aria-hidden="true">
    <defs><clipPath id="${idp}Clip"><path d="${SHIELD}"/></clipPath>${glyphDefs}</defs>
    <g clip-path="url(#${idp}Clip)">${wedges}</g>
    <path class="wedge" style="--d:1.6s" d="${SHIELD}" fill="none" stroke="#b08d57" stroke-width="3"/>
    ${weapons}
    <circle class="wedge" style="--d:2.0s" cx="50" cy="60" r="11" fill="#b08d57" stroke="#2b2216" stroke-width="1.2"/>
    <text class="wedge" style="--d:2.0s" x="50" y="64" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#2b2216">WL</text>
  </svg>`;
}

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if(menu.mode === 'install') render(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; if(menu.mode === 'install') render(); });

/* Loading screen: five lands drop in, gather, then the steel-and-bronze shield forms and the title fades in. Tap to skip. */
(function splash(){
  const names = ['Mountain','Forest','Swamp','Plains','Island'];
  const cards = names.map((n, i) => `<div class="splash-card" style="--i:${i};--gx:${(2 - i) * 66}px"><svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${artBody(n)}</svg><span>${n}</span></div>`).join('');
  const logo = warLogo('splash-shield', 'splash');
  const el = document.createElement('div');
  el.className = 'splash';
  el.innerHTML = `<div class="splash-cards">${cards}</div><div class="splash-logo">${logo}<div class="splash-title">War of Lands</div></div>`;
  el.addEventListener('click', () => el.remove());
  document.body.appendChild(el);
  setTimeout(() => el.classList.add('out'), 3300);
  setTimeout(() => el.remove(), 3900);
})();
</script>

/* Offline support for the installed app. Quietly skipped where service workers are unavailable (for example, inside the preview). */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    try { navigator.serviceWorker.register('./sw.js').catch(function(){}); } catch (err) {}
  });
}
