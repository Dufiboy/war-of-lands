<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root { --bg:#ffffff; --fg:#1a1a1a; --muted:#666; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16181d; --fg:#e8e8e8; --muted:#9aa0a6; } }
  :root[data-theme="dark"] { --bg:#16181d; --fg:#e8e8e8; --muted:#9aa0a6; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, sans-serif; }
  #map { position:absolute; inset:0; }
  .legend { position:absolute; bottom:16px; left:16px; z-index:1000; background:var(--bg); color:var(--fg);
            padding:10px 12px; border-radius:8px; box-shadow:0 1px 6px rgba(0,0,0,.25); font-size:13px; max-width:260px; }
  .legend h1 { font-size:15px; margin:0 0 6px; }
  .legend .row { display:flex; align-items:center; gap:8px; margin:3px 0; }
  .swatch { width:14px; height:14px; border-radius:3px; display:inline-block; }
  .muted { color:var(--muted); font-size:12px; margin-top:6px; }
  .empty { position:absolute; top:16px; left:50%; transform:translateX(-50%); z-index:1000; background:#fff3cd; color:#664d03;
           padding:8px 12px; border-radius:6px; font-size:13px; display:none; }
</style>
</head>
<body>
<div id="map"></div>
<div class="empty" id="empty">No zone data loaded yet. See data/zones.geojson.</div>
<div class="legend">
  <h1>Drone zones</h1>
  <div class="row"><span class="swatch" style="background:#d62828"></span>Prohibited</div>
  <div class="row"><span class="swatch" style="background:#f77f00"></span>Restricted</div>
  <div class="row"><span class="swatch" style="background:#1d4ed8"></span>Controlled airspace</div>
  <div class="row"><span class="swatch" style="background:#2a9d8f"></span>Nature / protected</div>
  <div class="row"><span class="swatch" style="background:#7b2cbf"></span>Urban / crowds</div>
  <div class="row"><span class="swatch" style="background:#888"></span>Other</div>
  <div class="muted">Not legal advice. Check the rule authority before flying.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  const COLORS = {
    prohibited: "#d62828", restricted: "#f77f00", controlled: "#1d4ed8",
    nature: "#2a9d8f", urban: "#7b2cbf", other: "#888"
  };
  const map = L.map("map").setView([-5, 20], 3);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors (ODbL)"
  }).addTo(map);

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  fetch("data/zones.geojson")
    .then(r => r.json())
    .then(gj => {
      const feats = gj.features || [];
      if (feats.length === 0) { document.getElementById("empty").style.display = "block"; return; }
      const layer = L.geoJSON(gj, {
        style: f => ({ color: COLORS[f.properties.zone_type] || COLORS.other, weight: 2, fillOpacity: 0.25 }),
        onEachFeature: (f, l) => {
          const p = f.properties;
          l.bindPopup(
            `<strong>${esc(p.zone_type)}</strong> (${esc(p.country)})<br>` +
            `Altitude: ${esc(p.altitude_limit || "not given")}<br>` +
            `Rule authority: ${esc(p.rule_authority)}<br>` +
            `<a href="${esc(p.source_url)}" target="_blank" rel="noopener">Source</a> &middot; ${esc(p.source_license)}<br>` +
            `Last checked: ${esc(p.last_checked)}`
          );
        }
      }).addTo(map);
      map.fitBounds(layer.getBounds(), { padding: [20, 20] });
    })
    .catch(() => { document.getElementById("empty").style.display = "block"; });
</script>
</body>
</html>
